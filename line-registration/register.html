<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123a24">
<title>TK7 ลงชื่อเตะบอล · Sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#0e1f15;--pitch-a:#123a24;--pitch-b:#10331f;--card:#ffffff;--ink:#16241b;--muted:#5d6e63;--line:#e3ebe5;
 --brand:#1f7a43;--brand-ink:#ffffff;--lime:#b9ee82;--warn:#ffcf70;--danger:#d64545;
 --green:#43a047;--red:#e53935;--white:#f5f5f5;--blue:#1e88e5;--black:#212121;--yellow:#fdd835;--pink:#ec407a;--orange:#fb8c00;--navy:#1a237e;--purple:#8e24aa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Kanit,system-ui,sans-serif;color:var(--ink);background:var(--bg);
 background-image:repeating-linear-gradient(180deg,var(--pitch-a) 0 56px,var(--pitch-b) 56px 112px);min-height:100vh}
button{font:inherit;cursor:pointer;border:0}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.top{color:#fff;padding:6px 2px 10px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lang{display:flex;background:rgba(0,0,0,.28);border-radius:999px;padding:3px}
.lang button{background:none;color:#cfe3d5;font-size:13px;padding:4px 12px;border-radius:999px}
.lang button[aria-pressed=true]{background:var(--lime);color:#13301e;font-weight:600}
.kicker{font-size:12px;letter-spacing:.12em;color:var(--lime);font-weight:600}
h1{font-size:20px;margin:4px 0 0;font-weight:600;color:#e6f3ea}
[hidden]{display:none!important}
.dates{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:0 0 auto;background:rgba(255,255,255,.1);color:#fff;border-radius:14px;padding:8px 14px;text-align:left;line-height:1.2;border:1px solid rgba(255,255,255,.14)}
.date b{display:block;font-size:15px;font-weight:600}
.date small{font-size:12px;opacity:.8}
.date[aria-pressed=true]{background:var(--lime);color:#13301e;border-color:var(--lime)}
.info{margin:12px 0 16px}
.match{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.m-head{background:linear-gradient(135deg,#1f6b3a,#2a8a4c);padding:16px 16px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.m-title{color:#fff;font-weight:700;font-size:20px;letter-spacing:.02em}
.m-sub{color:var(--lime);font-weight:600;font-size:14px}
.m-badge{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.m-badge.off{background:var(--warn);color:#3b2a00;border-color:var(--warn)}
.m-rows{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.m-row{display:flex;align-items:center;gap:10px;background:#f3f7f4;border-radius:12px;padding:10px;color:var(--ink);text-decoration:none;min-width:0}
.m-ico{font-size:22px;line-height:1}
.m-txt{display:flex;flex-direction:column;min-width:0}
.m-txt small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-txt b{font-size:16px;font-weight:700}
.m-txt b.link{color:#1f6fd1}
.m-foot{display:flex;justify-content:space-between;align-items:center;padding:0 12px 12px;gap:8px;font-size:14px;color:var(--muted)}
.m-hist{background:#eaf5ee;color:var(--brand);font-weight:600;font-size:13px;padding:7px 12px;border-radius:999px}
.pill{background:rgba(0,0,0,.28);color:#e9f5ec;border-radius:999px;padding:5px 11px;font-size:13px}
.pill.closed{background:var(--warn);color:#3b2a00}
button.pill.hist{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25)}
.hist-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hist-list li{background:#f2f6f3;border-radius:10px;padding:9px 12px;font-size:14px}
.hist-list li.hint{background:none;color:var(--muted);text-align:center}
.h-top{display:flex;justify-content:space-between;gap:8px}
.h-top time{color:var(--muted);font-size:12px}
.h-what{color:#3d5545;margin-top:2px}
.section-label{color:#d4e8da;font-size:13px;margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.section-label::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.16)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{background:var(--card);border-radius:16px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .12s}
.team:active{transform:translateY(2px)}
.team[disabled]{cursor:default}
.band{height:46px;position:relative;display:flex;align-items:center;padding:0 12px;gap:8px}
.band .shirt{width:26px;height:26px}
.band .name{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.band .count{margin-left:auto;font-weight:700;font-size:15px;background:rgba(255,255,255,.9);color:#1b2a20;border-radius:999px;padding:1px 9px}
.dots{display:flex;gap:4px;padding:10px 12px 4px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--brand)}
.players{padding:4px 12px 12px;display:flex;flex-wrap:wrap;gap:4px;min-height:24px}
.chip{background:#eef3ef;color:var(--ink);border-radius:8px;padding:2px 8px;font-size:13px}
button.chip{border:1px solid transparent}
.band{border:0;width:100%;text-align:left;cursor:pointer;font:inherit}
.sheet-head .band{width:auto;flex:0 0 auto}
.band .chev{font-size:13px;opacity:.9;margin-left:-2px}
.band:active{filter:brightness(.95)}
.plist{display:flex;flex-direction:column;padding:4px 8px 8px;gap:2px}
.prow{display:flex;align-items:center;gap:8px;background:none;border-radius:8px;padding:6px 6px;text-align:left;font-size:15px;color:var(--ink);width:100%}
.prow:active{background:#eef3ef}
.prow.on{background:#e3f4e8}
.prow .box{width:20px;height:20px;flex:0 0 20px;border:2px solid #b9c7bd;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.prow.on .box{background:var(--brand);border-color:var(--brand)}
.prow.empty .box{border-style:dashed;border-color:#d5ded8}
.prow.empty .pname{color:#a3b2a8;font-size:14px}
.prow{min-height:38px}
.team{height:100%}
.team .cta{margin-top:auto}
.prow .num{color:var(--muted);font-size:13px;min-width:18px}
.prow .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tap-hint{color:#cfe3d5;font-size:12.5px;margin:-2px 2px 8px}
.more{width:100%;margin-top:12px;background:rgba(255,255,255,.12);color:#fff;border:1px dashed rgba(255,255,255,.35);border-radius:12px;padding:12px;font-size:15px}
.selbar{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.3);padding:12px 14px calc(12px + env(safe-area-inset-bottom));transform:translateY(110%);visibility:hidden;transition:transform .2s,visibility .2s;z-index:15}
.selbar.show{transform:none;visibility:visible}
.sel-n{font-weight:600;font-size:14px;margin-bottom:8px;color:var(--ink)}
.sel-actions{display:flex;gap:8px}
.sel-actions button{padding:11px 12px;border-radius:10px;font-size:14px;font-weight:600}
.b-main{flex:1;background:var(--brand);color:#fff}.b-soft{background:#eef3ef;color:var(--ink)}.b-danger{background:#fdecec;color:var(--danger)}
.refresh.lift{bottom:calc(120px + env(safe-area-inset-bottom))}
.cta{margin:0 10px 10px;padding:8px;font-size:14px;color:var(--brand);font-weight:600;background:#eaf5ee;border-radius:10px;text-align:center}
.cta:disabled{color:var(--muted);background:#f1f4f2;cursor:default}
.empty-grid .dots{display:none}
.empty-grid .cta{margin-top:10px}
.c-green{background:var(--green);color:#fff}.c-red{background:var(--red);color:#fff}.c-white{background:var(--white);color:#222;border-bottom:1px solid var(--line)}
.c-blue{background:var(--blue);color:#fff}.c-black{background:var(--black);color:#fff}.c-yellow{background:var(--yellow);color:#222}
.c-pink{background:var(--pink);color:#fff}.c-orange{background:var(--orange);color:#fff}.c-navy{background:var(--navy);color:#fff}.c-purple{background:var(--purple);color:#fff}
.notice{background:rgba(0,0,0,.3);color:#fff;border-radius:14px;padding:18px;text-align:center;margin-top:16px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(200%);visibility:hidden;background:#13241a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .25s;z-index:30}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.toast.err{background:var(--danger)}
.refresh{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:#fff;color:var(--brand);width:48px;height:48px;border-radius:50%;box-shadow:0 6px 16px rgba(0,0,0,.3);font-size:22px;z-index:10}
.refresh.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;max-width:560px;margin:0 auto;transform:translateY(110%);visibility:hidden;transition:transform .25s,visibility .25s;z-index:21;max-height:88vh;overflow:auto;padding:0 0 calc(16px + env(safe-area-inset-bottom))}
.sheet.show{transform:none;visibility:visible}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#cfd8d2;margin:8px auto 0}
.sheet-head{padding:12px 18px;display:flex;align-items:center;gap:10px}
.sheet-head .shirt{width:34px;height:34px}
.sheet-head h2{font-size:19px;margin:0}
.sheet-head p{margin:0;color:var(--muted);font-size:13px}
.sheet-body{padding:4px 18px}
.field{display:flex;gap:8px;margin-bottom:8px}
.field input{flex:1;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1.5px solid #cfdad2;background:#f8fbf9;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--brand);background:#fff}
.field button{width:44px;border-radius:10px;background:#eef3ef;color:var(--muted);font-size:18px}
.add{background:none;color:var(--brand);font-weight:600;padding:6px 0}
.primary{width:100%;background:var(--brand);color:#fff;font-weight:600;font-size:17px;padding:13px;border-radius:12px;margin-top:10px}
.primary:disabled{opacity:.5}
.ghost{width:100%;background:#eef3ef;color:var(--ink);padding:12px;border-radius:12px;margin-top:8px}
.danger{width:100%;background:#fdecec;color:var(--danger);font-weight:600;padding:12px;border-radius:12px;margin-top:8px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.move-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.move-grid button{border-radius:10px;padding:8px 0 6px;font-size:12px;line-height:1.2}
.move-grid button[disabled]{opacity:.35}
.move-grid button[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:1px}
.swap-list{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.swap-list button[aria-pressed=true]{background:var(--ink);color:#fff}
.label{font-size:14px;font-weight:600;margin:12px 0 2px}
.skeleton{height:132px;border-radius:16px;background:rgba(255,255,255,.08);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
</style>
</head>
<body>
<div class="wrap">
 <header class="top">
  <div class="toprow"><div class="kicker">TK7 FOOTBALL · 7 A SIDE</div><div class="lang" id="lang" role="group" aria-label="Language"><button type="button" data-lang="th">ไทย</button><button type="button" data-lang="en">EN</button></div></div>
  <nav class="dates" id="dates" aria-label="วันแข่ง"></nav>
  <div class="info" id="info"></div>
  <h1 id="title">👇 เลือกสีเสื้อ แล้วลงชื่อ</h1>
 </header>
 <main id="board">
  <div class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
 </main>
</div>
<button class="refresh" id="refresh" aria-label="รีเฟรชรายชื่อ">↻</button>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-content"></div></section>
<div class="toast" id="toast" role="status"></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="registration.js?v=20261103-8"></script>
</body>
</html>
